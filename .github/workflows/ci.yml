# De poort van deze repo, server-side. Dit is exact dezelfde poort die `open-pr` lokaal draait
# (scripts/lint/lint-web.ps1), maar dan onontkoombaar: ook een PR die buiten de scripts om ontstaat --
# via de GitHub-UI, of met een vergeten -SkipLint -- komt hier langs.
#
# WAAROM DIT BESTAAT
# ------------------
# Mergen is in deze repo deployen: `gh pr merge` schrijft rechtstreeks in origin/main en Netlify
# publiceert bij elke push naar main. Er is geen staging. De poort was tot nu toe alleen lokaal en
# hing daarmee af van of iemand `open-pr` gebruikte; dit sluit dat gat.
#
# WAAROM ubuntu EN NIET windows, ANDERS DAN IN DE BRON
# ----------------------------------------------------
# De bron (claude-code-specialists) draait zijn CI op windows-latest, omdat zijn scripts Windows
# PowerShell 5.1 targeten en het geteste product de scripts zelf zijn. Hier is het geteste product de
# site, en die wordt door Netlify op LINUX gebouwd. Dat verschil is niet cosmetisch: een import met de
# verkeerde letterkast (`./header` terwijl het bestand `Header.tsx` heet) bouwt probleemloos op het
# case-insensitieve Windows-bestandssysteem en breekt op Netlify. Precies de klasse fout die de lokale
# poort structureel niet kan vangen en die de live site plat legt. Daarom draait de poort hier op de
# runner die Netlify het dichtst benadert, met `shell: pwsh` in plaats van `shell: powershell`.
name: CI

# Least-privilege: deze workflow leest alleen -- de GITHUB_TOKEN krijgt geen schrijfrechten.
permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [main]

jobs:
  poort:
    runs-on: ubuntu-latest
    steps:
      # v5 en niet v4 (dat is wat de bron gebruikt): v4 draait op Node 20, dat op de runners is
      # afgeschaft, en levert bij elke run een deprecation-annotatie op. Gemeten bij de eerste run van
      # deze workflow, run 31732352110.
      - uses: actions/checkout@v5

      # De Node-versie komt sinds 2026-08-13 uit .nvmrc en staat hier niet meer los genoemd. Dat
      # bestand is de enige plek waar deze repo zijn Node-versie verklaart, en dat is precies waarom
      # het er is: Netlify LEEST .nvmrc, dus CI en de live build kunnen niet meer uit elkaar lopen
      # zonder dat iemand dat bestand aanraakt. Daarvoor stond hier '22' hardgecodeerd terwijl Netlify
      # zijn eigen default draaide, en niets meldde het als die twee divergeerden.
      #
      # .nvmrc HOUDT DE VOLLEDIGE VERSIE (22.15.1) EN NIET ALLEEN DE MAJOR, en dat is gemeten en geen
      # voorkeur. Met '22' pakt setup-node de laatste 22.x en daarmee een NIEUWERE npm dan lokaal. Die
      # npm installeert de optionele peerDependency `yaml ^2.4.2` van vite 8.2.1 wel, terwijl de
      # lokale npm hem overslaat -- waardoor `npm ci` afbrak op "Missing: yaml@2.9.0 from lock file"
      # terwijl `npm ci` lokaal gewoon slaagde. Netlify kwam er langs omdat die `npm install` gebruikt
      # in plaats van `npm ci`. Een major-pin pint dus de taal maar niet de pakketmanager, en juist die
      # laatste bepaalt of de lockfile geldig is. Bump deze versie bewust, niet met een major-alias.
      - uses: actions/setup-node@v5
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      # `npm ci` en niet `npm install`: die respecteert package-lock.json exact, zodat de poort meet
      # wat er in de repo staat en niet wat er vandaag toevallig nieuwer is. lint-web.ps1 stopt met een
      # eigen melding als node_modules ontbreekt, dus deze stap gaat eraan vooraf.
      - run: npm ci

      # DEZELFDE POORT die open-pr.ps1 lokaal draait -- geen tweede kopie van tsc + build hier. Een
      # kopie in een workflow die niemand openslaat is precies wat er als eerste uit de pas gaat lopen
      # met het script dat wel wordt onderhouden.
      - name: Poort (scripts/lint/lint-web.ps1 -- tsc --noEmit + npm run build)
        shell: pwsh
        run: ./scripts/lint/lint-web.ps1

      # DE TESTSUITE, en die draait hier als een gewone npm-stap in plaats van via de gedeelde
      # Invoke-TestSuiteGate zoals de bron doet. Dat is geen afwijking uit gemak: die gate woont in
      # scripts/lib/native-capture-lib.ps1 van de BRON, en een consumer heeft dat bestand niet in zijn
      # repo -- het komt uit de plugin onder ~/.claude, die op een CI-runner niet bestaat. De gate
      # dot-sourcen zou hier dus falen op een ontbrekend bestand.
      #
      # Lokaal loopt het wel via die gate: `Get-TestCommands` in scripts/repo-config.ps1 geeft
      # 'npx vitest run' terug, en open-pr en cut-release draaien dat naast de PowerShell-suites.
      # Beide wegen komen daarmee bij dezelfde suite uit, en dat is wat telt -- maar het is bewust
      # geen tweede kopie van de LOGICA, alleen van de aanroep.
      - name: Testsuite (tests/*.test.ts -- Vitest)
        run: npm test
